<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành Tạo Menu Ngang Dropdown</title>
    <style>
      /* 1. Reset thuộc tính mặc định và đặt phông chữ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background-color: #f4f6f9;
        padding: 30px;
      }

      h2 {
        margin-bottom: 25px;
        color: #2c3e50;
      }

      /* 2. Cố định phân vùng, chiều cao và màu nền thanh menu */
      #menu {
        height: 45px;
        background-color: #333333;
        border-radius: 4px;
      }

      #menu ul {
        list-style: none;
      }

      /* 3. Cho các phần tử danh sách cấp 1 xếp thành hàng ngang */
      #menu > ul > li {
        float: left;
        position: relative; /* Điểm tựa định vị cho menu con cấp 2 */
      }

      /* 4. Định dạng các liên kết <a> trong menu */
      #menu a {
        display: block;
        width: 150px;
        height: 45px;
        line-height: 45px;
        text-align: center;
        text-decoration: none;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        transition: background-color 0.25s ease;
      }

      /* 5. Chuyển màu nền sang màu đỏ khi hover qua liên kết */
      #menu li:hover > a {
        background-color: #e74c3c;
      }

      /* 6 & 7. Định vị menu con cấp 2 buông xuống và ẩn đi mặc định */
      #menu ul ul {
        position: absolute;
        top: 45px; /* Nằm ngay mép dưới của menu cha */
        left: 0;
        background-color: #222222;
        visibility: hidden; /* Ẩn menu con khi bình thường */
        opacity: 0;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition:
          visibility 0.2s,
          opacity 0.2s ease;
      }

      /* Menu con xếp dọc từng hàng */
      #menu ul ul li {
        position: relative;
        border-bottom: 1px solid #444444;
      }

      #menu ul ul a {
        text-align: left;
        padding-left: 15px;
        width: 170px;
        height: 40px;
        line-height: 40px;
        font-size: 14px;
      }

      /* 8. Hiển thị menu con buông xuống khi rê chuột qua mục chọn cha */
      #menu li:hover > ul {
        visibility: visible;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h2>Menu Ngang Thả Xuống (Horizontal Dropdown Menu)</h2>

    <div id="menu">
      <ul>
        <li><a href="#">Trang chủ</a></li>
        <li>
          <a href="#">Khóa học &#9662;</a>
          <!-- Trình đơn con cấp 2 thả xuống -->
          <ul>
            <li><a href="#">Khóa học HTML</a></li>
            <li><a href="#">Khóa học CSS</a></li>
            <li><a href="#">JavaScript</a></li>
            <li><a href="#">Git & GitHub</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Dịch vụ &#9662;</a>
          <!-- Trình đơn con cấp 2 thả xuống -->
          <ul>
            <li><a href="#">Thiết kế Website</a></li>
            <li><a href="#">Lập trình Web App</a></li>
            <li><a href="#">Bảo mật Web</a></li>
          </ul>
        </li>
        <li><a href="#">Tin tức</a></li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </div>
  </body>
</html>
